plugins {
    id 'com.android.application'
}

// Alamat aplikasi web yang dibuka oleh APK
def webHost = "tengkuilhamsyahti-lgtm.github.io"
def webUrl = "https://tengkuilhamsyahti-lgtm.github.io/struk-spbu/"

android {
    namespace 'io.github.tengkuilhamsyahti.strukspbu'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tengkuilhamsyahti.strukspbu'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
        manifestPlaceholders = [hostName: webHost, defaultUrl: webUrl, launcherName: "Struk SPBU"]
    }

    signingConfigs {
        release {
            storeFile file("../release.jks")
            storePassword "strukspbu"
            keyAlias "strukspbu"
            keyPassword "strukspbu"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
